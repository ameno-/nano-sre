services:
  keep-websocket-server:
    image: quay.io/soketi/soketi:1.4-16-debian
    ports:
      - "36001:6001"
      - "39601:9601"
    environment:
      - SOKETI_USER_AUTHENTICATION_TIMEOUT=3000
      - SOKETI_DEBUG=1
      - SOKETI_DEFAULT_APP_ID=1
      - SOKETI_DEFAULT_APP_KEY=keepappkey
      - SOKETI_DEFAULT_APP_SECRET=keepappsecret

  keep-backend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api
    ports:
      - "38080:8080"
    environment:
      - PORT=8080
      - AUTH_TYPE=NOAUTH
      - SECRET_MANAGER_TYPE=FILE
      - SECRET_MANAGER_DIRECTORY=/state
      - DATABASE_CONNECTION_STRING=sqlite:////state/db.sqlite3?check_same_thread=False
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - KEEP_METRICS=true
      - PUSHER_APP_ID=1
      - PUSHER_APP_KEY=keepappkey
      - PUSHER_APP_SECRET=keepappsecret
      - PUSHER_HOST=keep-websocket-server
      - PUSHER_PORT=6001
      - USE_NGROK=false
    volumes:
      - ./state:/state
    depends_on:
      - keep-websocket-server

  keep-frontend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui
    ports:
      - "38000:3000"
    environment:
      - AUTH_TYPE=NOAUTH
      - NEXTAUTH_SECRET=secret
      - NEXTAUTH_URL=http://localhost:38000
      - NEXT_PUBLIC_API_URL=http://localhost:38080
      - API_URL=http://keep-backend:8080
      - PUSHER_HOST=localhost
      - PUSHER_PORT=36001
      - PUSHER_APP_KEY=keepappkey
    volumes:
      - ./state:/state
    depends_on:
      - keep-backend

  nano-sre-harness:
    build:
      context: ./services/nano-sre-harness
    ports:
      - "38790:8790"
    environment:
      - PORT=8790
      - KEEP_BASE_URL=http://keep-backend:8080
      - KEEP_X_API_KEY=${KEEP_X_API_KEY:-local-dev}
      - KEEP_LOKI_PROVIDER_ID=${KEEP_LOKI_PROVIDER_ID:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NANO_SRE_PROVIDER=${NANO_SRE_PROVIDER:-openrouter}
      - NANO_SRE_MODEL_ID=${NANO_SRE_MODEL_ID:-google/gemini-3-flash-preview}
      - NANO_SRE_THINKING_LEVEL=${NANO_SRE_THINKING_LEVEL:-off}
      - NANO_SRE_SERVICE_TOKEN=${NANO_SRE_SERVICE_TOKEN:-}
      - NANO_SRE_STORE_PATH=${NANO_SRE_STORE_PATH:-/tmp/nano-sre-store.json}
    depends_on:
      - keep-backend

  nanobot:
    profiles: ["nanobot"]
    # bootstrap.sh clones HKUDS/nanobot into ./vendor/nanobot
    build:
      context: ./vendor/nanobot
    command: ["gateway"]
    ports:
      - "18790:18790"
    environment:
      - NANOBOT_HOME=/root/.nanobot
      - NANOBOT_ENV=${NANOBOT_ENV:-development}
      - KEEP_API_URL=http://keep-backend:8080
      - GEMINI_SRE_BASE_URL=http://nano-sre-harness:8790
      - GEMINI_SRE_SERVICE_TOKEN=${NANO_SRE_SERVICE_TOKEN:-}
      - NANOBOT_TRACE=1
    volumes:
      - ./nanobot:/root/.nanobot
    depends_on:
      - keep-backend
      - nano-sre-harness
